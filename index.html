<script>
(function (root) {
'use strict';
const TAU = Math.PI * 2;
const CFG = {
  Rg: 1200,          // 放射層の外縁（ワールド単位）= 0.7 R☉
  blobs: 100,        // 吸収域の数
  blobRmin: 26, blobRmax: 52,
  startClear: 150,
  l0: 50, l1: 230,   // 歩幅（中心→外縁）
  scatter0: 0.40, scatter1: 0.22
};
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function prog(r) { return Math.min(1, r / CFG.Rg); }
function stepLen(r) { const p = prog(r); return CFG.l0 + (CFG.l1 - CFG.l0) * Math.pow(p, 1.4); }
function scatterProb(r) { const p = prog(r); return CFG.scatter0 + (CFG.scatter1 - CFG.scatter0) * p; }

function genWorld(rng) {
  const a = rng() * TAU, rr = rng() * 40;
  const start = { x: Math.cos(a) * rr, y: Math.sin(a) * rr };
  const blobs = []; let guard = 0;
  while (blobs.length < CFG.blobs && guard++ < 100000) {
    const r = CFG.Rg * Math.sqrt(rng()), t = rng() * TAU;
    if (rng() > 1 - 0.7 * r / CFG.Rg) continue;      // 中心ほど濃い
    const x = Math.cos(t) * r, y = Math.sin(t) * r;
    if (Math.hypot(x - start.x, y - start.y) < CFG.startClear) continue;
    blobs.push({ x, y, r: CFG.blobRmin + (CFG.blobRmax - CFG.blobRmin) * rng() });
  }
  return { start, blobs };
}

// 線分 (px,py)+s*(cos,sin), s∈[0,len] の最初のイベント（吸収域に入る or 外縁を出る）
function firstEvent(px, py, ang, len, blobs) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let best = null;
  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    const fx = px - b.x, fy = py - b.y;
    const bb = fx * dx + fy * dy, c = fx * fx + fy * fy - b.r * b.r;
    if (c <= 0) return { s: 0, type: 'blob', blob: b };
    const disc = bb * bb - c; if (disc < 0) continue;
    const s = -bb - Math.sqrt(disc);
    if (s < 0 || s > len) continue;
    if (!best || s < best.s) best = { s, type: 'blob', blob: b };
  }
  const b2 = px * dx + py * dy, c2 = px * px + py * py - CFG.Rg * CFG.Rg;
  const se = -b2 + Math.sqrt(Math.max(0, b2 * b2 - c2));
  if (se <= len && (!best || se < best.s)) best = { s: se, type: 'escape' };
  return best;
}

// 3方向の候補。少なくとも1つは（散乱が起きなければ）安全な方向を含める
function genCandidates(world, pos, rng) {
  const r = Math.hypot(pos.x, pos.y), L = stepLen(r), out = Math.atan2(pos.y, pos.x);
  let cands = null;

// ---- 太陽系の幾何（画面サイズに応じて毎フレーム計算） ----
function geom() {

// ================= 旅の総合結果と図鑑 =================
let J = {};

const DEX_KEY = 'photon_dex_v1';

const LOSS_NAMES = { o3: 'オゾン層で吸収', cloud: '雲で散乱', gas: '水蒸気・CO₂の吸収帯', scat: '空気分子・塵で散乱', miss: '地球を外れた', mercury: '水星に遮られた', venus: '金星に遮られた', moon: '月に遮られた（日食）', comet: '彗星の尾で散乱' };
const DEX_CATS = [
  ['band', '波長帯（ステージ2）', () => BAND_NAMES.map(n => [n, n])],
  ['site', '降りた地点', () => D3.SITES.map(x => [x.id, x.name])],

  ['nrx', 'ニュートリノ：生まれ方', () => D4.REACTIONS.map(x => [x.id, x.name]).concat([['sn', '超新星ニュートリノ'], ['atm', '大気ニュートリノ'], ['acc', '加速器ニュートリノ']])],
  ['nfl', 'ニュートリノ：届いた型', () => [['e', '電子型'], ['mu', 'ミュー型'], ['tau', 'タウ型'], ['ae', '反電子型'], ['x', 'ミュー／タウ型']]],

  ['ndet', 'ニュートリノ：出会った検出器', () => D4.DETECTORS.map(x => [x.id, x.name])],
  ['ngh', 'ニュートリノ：すり抜けた天体', () => [['mercury', '水星'], ['venus', '金星'], ['moon', '月'], ['comet', '彗星の尾']]],
  ['loss', '失われ方（ステージ3）', () => Object.keys(LOSS_NAMES).map(k => [k, LOSS_NAMES[k]])]

function dexLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(DEX_KEY)) || {};
    if (!localStorage.getItem('photon_dexfix1')) {   // 旧バグ（結果画面の再描画で毎フレーム加算）で水増しされたニュートリノ項目を ×1 に戻す
      for (const c of ['nrx', 'nfl', 'ndet', 'ngh']) if (d[c]) for (const k in d[c]) d[c][k] = 1;
      localStorage.setItem(DEX_KEY, JSON.stringify(d)); localStorage.setItem('photon_dexfix1', '1');
    }
    return d;
  } catch (e) { return {}; }
}
function dexAdd(list) {   // list: [[cat,id,name],...] → 新規登録の名前を返す
  const d = dexLoad(), fresh = [];
  for (const [c, id, nm] of list) { d[c] = d[c] || {}; if (!d[c][id]) fresh.push(nm); d[c][id] = (d[c][id] || 0) + 1; }
  try { localStorage.setItem(DEX_KEY, JSON.stringify(d)); } catch (e) {}
  return fresh;
}
const newNote = f => f.length ? `<div class="note"><b>図鑑に新登録</b>　${f.join('、')}</div>` : '';
function totalRank(t) { return t >= 5700 ? 'S' : t >= 5100 ? 'A' : t >= 4400 ? 'B' : 'C'; }
const DEX_TABS = { p: ['band', 'site', 'wx', 'recv', 'loss'], n: ['nrx', 'nfl', 'nosc', 'ndet', 'ngh'] };
let dexTab = 'p';
